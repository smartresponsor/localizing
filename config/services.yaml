parameters:
  localizing.default_locale: 'en'
  localizing.supported_locales:
    - 'en'
    - 'uk'
    - 'ru'
    - 'es'
    - 'de'
    - 'fr'
    - 'pl'
    - 'pt'
    - 'it'
    - 'nl'
    - 'tr'
    - 'ar'
  localizing.catalog_source_dir: '%kernel.project_dir%/resources/catalogs'
  localizing.catalog_export_dir: '%kernel.project_dir%/var/export/translations'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Localizing\:
    resource: '../src/'

  App\Localizing\Controller\:
    resource: '../src/Controller/'
    public: true
    tags: ['controller.service_arguments']

  App\Localizing\Service\LocaleRegistryService:
    arguments:
      $configuredLocales: '%localizing.supported_locales%'
      $defaultLocaleCode: '%localizing.default_locale%'

  App\Localizing\Service\Catalog\LocaleCatalogScannerService:
    arguments:
      $catalogDirectory: '%localizing.catalog_source_dir%'

  App\Localizing\Service\Catalog\LocaleCatalogExporterService:
    arguments:
      $exportDirectory: '%localizing.catalog_export_dir%'

  App\Localizing\ServiceInterface\Catalog\LocaleCatalogScannerServiceInterface: '@App\Localizing\Service\Catalog\LocaleCatalogScannerService'
  App\Localizing\ServiceInterface\Catalog\LocaleCatalogExporterServiceInterface: '@App\Localizing\Service\Catalog\LocaleCatalogExporterService'
  App\Localizing\ServiceInterface\Quality\LocaleCatalogAuditorServiceInterface: '@App\Localizing\Service\Quality\LocaleCatalogAuditorService'
  App\Localizing\ServiceInterface\LocaleCodeNameConverterServiceInterface: '@App\Localizing\Service\LocaleCodeNameConverterService'
  App\Localizing\Resolver\LocaleFallbackResolverInterface: '@App\Localizing\Resolver\LocaleFallbackResolver'
  App\Localizing\ServiceInterface\LocaleRegistryServiceInterface: '@App\Localizing\Service\LocaleRegistryService'
