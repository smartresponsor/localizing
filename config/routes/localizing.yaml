localizing_api_locale_list:
  path: /api/locale
  controller: App\Localizing\Controller\Api\LocaleApiController::__invoke
  methods: [GET]

localizing_api_locale_fallback:
  path: /api/locale/{code}/fallback
  controller: App\Localizing\Controller\Api\LocaleFallbackApiController::__invoke
  methods: [GET]

localizing_api_translation_domain_list:
  path: /api/locale/translation/domain
  controller: App\Localizing\Controller\Api\LocaleTranslationDomainApiController::__invoke
  methods: [GET]

localizing_api_translation_key_list:
  path: /api/locale/translation/key
  controller: App\Localizing\Controller\Api\LocaleTranslationKeyApiController::__invoke
  methods: [GET]

localizing_api_translation_message_resolve:
  path: /api/locale/translation/message/resolve
  controller: App\Localizing\Controller\Api\LocaleTranslationMessageApiController::resolve
  methods: [GET]

localizing_api_terminology_list:
  path: /api/locale/terminology
  controller: App\Localizing\Controller\Api\LocaleTerminologyApiController::__invoke
  methods: [GET]

localizing_admin_locale_list:
  path: /admin/locale
  controller: App\Localizing\Controller\Admin\LocaleAdminController::list
  methods: [GET]

localizing_admin_locale_register:
  path: /admin/locale
  controller: App\Localizing\Controller\Admin\LocaleAdminController::register
  methods: [POST]

localizing_admin_locale_enable:
  path: /admin/locale/{code}/enable
  controller: App\Localizing\Controller\Admin\LocaleAdminController::enable
  methods: [PATCH]

localizing_admin_locale_disable:
  path: /admin/locale/{code}/disable
  controller: App\Localizing\Controller\Admin\LocaleAdminController::disable
  methods: [PATCH]

localizing_admin_fallback_list:
  path: /admin/locale/{code}/fallback
  controller: App\Localizing\Controller\Admin\LocaleFallbackAdminController::list
  methods: [GET]

localizing_admin_fallback_add:
  path: /admin/locale/{code}/fallback
  controller: App\Localizing\Controller\Admin\LocaleFallbackAdminController::add
  methods: [POST]

localizing_admin_fallback_remove:
  path: /admin/locale/{code}/fallback/{id}
  controller: App\Localizing\Controller\Admin\LocaleFallbackAdminController::remove
  requirements:
    id: \d+
  methods: [DELETE]

localizing_admin_translation_domain_list:
  path: /admin/locale/translation/domain
  controller: App\Localizing\Controller\Admin\LocaleTranslationDomainAdminController::list
  methods: [GET]

localizing_admin_translation_domain_register:
  path: /admin/locale/translation/domain
  controller: App\Localizing\Controller\Admin\LocaleTranslationDomainAdminController::register
  methods: [POST]

localizing_admin_translation_key_list:
  path: /admin/locale/translation/key
  controller: App\Localizing\Controller\Admin\LocaleTranslationKeyAdminController::list
  methods: [GET]

localizing_admin_translation_key_register:
  path: /admin/locale/translation/key
  controller: App\Localizing\Controller\Admin\LocaleTranslationKeyAdminController::register
  methods: [POST]

localizing_admin_translation_message_list:
  path: /admin/locale/translation/message
  controller: App\Localizing\Controller\Admin\LocaleTranslationMessageAdminController::list
  methods: [GET]

localizing_admin_translation_message_upsert:
  path: /admin/locale/translation/message
  controller: App\Localizing\Controller\Admin\LocaleTranslationMessageAdminController::upsert
  methods: [PUT]

localizing_admin_audit_findings:
  path: /admin/locale/audit/finding
  controller: App\Localizing\Controller\Admin\LocaleTranslationAuditAdminController::findings
  methods: [GET]

localizing_admin_audit_run:
  path: /admin/locale/audit/run
  controller: App\Localizing\Controller\Admin\LocaleTranslationAuditAdminController::run
  methods: [POST]

localizing_admin_catalog_scan:
  path: /admin/locale/catalog/scan
  controller: App\Localizing\Controller\Admin\LocaleCatalogAdminController::scan
