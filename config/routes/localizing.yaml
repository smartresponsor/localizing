  methods: [POST]

localizing_admin_terminology_list:
  path: /admin/locale/terminology
  controller: App\Localizing\Controller\Admin\LocaleTerminologyAdminController::list
  methods: [GET]

localizing_admin_terminology_register:
  path: /admin/locale/terminology
  controller: App\Localizing\Controller\Admin\LocaleTerminologyAdminController::register
  methods: [POST]

localizing_admin_terminology_update:
  path: /admin/locale/terminology/{id}
  controller: App\Localizing\Controller\Admin\LocaleTerminologyAdminController::update
  requirements:
    id: \d+
  methods: [PATCH]

locale.index:
  path: /locale/index
  controller: App\Localizing\Controller\Admin\LocaleAdminController::list
  methods: [GET]
